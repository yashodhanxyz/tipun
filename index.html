<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipun</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fbfbf7;
      --fg: #1f1f1c;
      --muted: #8b8a84;
      --muted-soft: #c9c7bd;
      --accent: #2f6feb;
      --hairline: rgba(38,38,34,0.10);
      --panel: rgba(255,255,251,0.94);
      --chip: rgba(38,38,34,0.045);
      --shadow: 0 18px 60px rgba(31,31,28,0.14);
      --editor-font: Georgia, 'Times New Roman', serif;
      --font-size: 20px;
      --editor-lh: 36.4px;
      --overlay-bg: rgba(251,251,247,0.78);
    }

    [data-theme="dark"] {
      --bg: #171716;
      --fg: #d8d6cc;
      --muted: #858176;
      --muted-soft: #4c4942;
      --hairline: rgba(216,214,204,0.12);
      --panel: rgba(30,30,28,0.94);
      --chip: rgba(216,214,204,0.06);
      --shadow: 0 20px 70px rgba(0,0,0,0.42);
      --overlay-bg: rgba(23,23,22,0.78);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      transition: background 0.25s, color 0.25s;
    }

    .page {
      height: 100vh;
      padding: 64px 24px 64px;
      overflow: hidden;
    }

    .editor-container {
      position: relative;
      width: 100%;
      max-width: 680px;
      height: 100%;
      margin: 0 auto;
    }

    #editor {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      font-family: var(--editor-font);
      font-size: var(--font-size);
      line-height: var(--editor-lh);
      padding-top: calc(50vh - 100px);
      padding-bottom: 120px;
      word-break: break-word;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
      color: var(--fg);
      outline: none;
      caret-color: var(--accent);
      overflow-y: auto;
      scrollbar-width: none;
    }

    #editor::-webkit-scrollbar { display: none; }

    /* Heading blocks — font size is applied directly to the block div,
       so cursor position always matches the rendered text */
    #editor > div[data-type="h1"] {
      font-size: 1.55em;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    #editor > div[data-type="h2"] {
      font-size: 1.3em;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    #editor > div[data-type="h3"] {
      font-size: 1.15em;
      font-weight: 600;
      line-height: 1.35;
    }

    /* Placeholder for empty blocks */
    #editor > div[data-type="normal"][data-empty]:only-child::before {
      content: 'Start writing…';
      color: var(--muted-soft);
      pointer-events: none;
    }
    #editor > div[data-type="h1"][data-empty]::before { content: 'Heading 1'; opacity: 0.25; pointer-events: none; }
    #editor > div[data-type="h2"][data-empty]::before { content: 'Heading 2'; opacity: 0.25; pointer-events: none; }
    #editor > div[data-type="h3"][data-empty]::before { content: 'Heading 3'; opacity: 0.25; pointer-events: none; }

    /* Focus mode */
    .focus-mode .page {
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,0.3) 18%,
        black 32%,
        black 68%,
        rgba(0,0,0,0.3) 82%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,0.3) 18%,
        black 32%,
        black 68%,
        rgba(0,0,0,0.3) 82%,
        transparent 100%
      );
    }

    /* Corner trigger — bottom-right logo */
    .corner-trigger {
      position: fixed;
      bottom: 22px;
      right: 22px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--fg);
      padding: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 100;
      border-radius: 50%;
    }

    .corner-logo {
      width: 18px;
      height: 18px;
      display: block;
      flex-shrink: 0;
    }

    body.idle .corner-trigger        { opacity: 0.18; }
    .corner-trigger:hover            { opacity: 0.72 !important; }
    .focus-mode .corner-trigger      { opacity: 0 !important; }
    .focus-mode .corner-trigger:hover { opacity: 0.44 !important; }

    /* Full-screen frosted-glass overlay */
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      z-index: 200;
    }

    .overlay-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-card {
      display: flex;
      width: min(780px, calc(100vw - 48px));
      height: min(540px, calc(100vh - 80px));
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateY(-10px) scale(0.97);
      transition: transform 0.18s ease;
    }

    .overlay-backdrop.open .overlay-card {
      transform: translateY(0) scale(1);
    }

    /* Brand header inside overlay */
    .overlay-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 20px 20px 12px;
      border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
    }

    .overlay-brand-logo {
      width: 14px;
      height: 14px;
      display: block;
      flex-shrink: 0;
      color: var(--fg);
    }

    .overlay-brand-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Notes column */
    .overlay-notes {
      width: 42%;
      border-right: 1px solid var(--hairline);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: "SF Pro Text", "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .overlay-streak {
      padding: 16px 20px;
      border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
    }

    .overlay-streak-main {
      font-size: 26px;
      font-weight: 700;
      color: var(--fg);
      line-height: 1;
      margin-bottom: 5px;
      letter-spacing: -0.02em;
    }

    .overlay-streak-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .overlay-note-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 6px;
    }

    .overlay-note-list::-webkit-scrollbar { display: none; }

    .overlay-note-row {
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .overlay-note-row:hover { background: var(--chip); }
    .overlay-note-row.active { background: var(--chip); }

    .overlay-note-date {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .today-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .overlay-note-preview {
      font-size: 13px;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .overlay-note-words {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Settings column */
    .overlay-settings {
      flex: 1;
      padding: 24px 22px 20px;
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      font-family: "SF Pro Text", "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .overlay-settings::-webkit-scrollbar { display: none; }

    .overlay-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .overlay-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--fg);
    }

    .overlay-toggle {
      width: 34px;
      height: 19px;
      background: var(--muted-soft);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .overlay-toggle::after {
      content: '';
      position: absolute;
      width: 13px;
      height: 13px;
      background: white;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: left 0.2s;
    }

    .overlay-toggle[data-on="true"]          { background: var(--accent); }
    .overlay-toggle[data-on="true"]::after   { left: 18px; }

    .overlay-divider {
      height: 1px;
      background: var(--hairline);
      margin: 14px 0;
    }

    .overlay-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--chip);
      border: 1px solid var(--hairline);
      border-radius: 9px;
      font-size: 13px;
      color: var(--fg);
      font-family: inherit;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      margin-bottom: 12px;
    }

    .overlay-select:focus { outline: none; border-color: var(--accent); }

    .overlay-size-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--fg);
      margin-bottom: 12px;
    }

    .overlay-size-ctrl {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .overlay-size-btn {
      width: 26px;
      height: 26px;
      background: var(--chip);
      border: 1px solid var(--hairline);
      border-radius: 999px;
      cursor: pointer;
      color: var(--fg);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .overlay-size-btn:hover { background: color-mix(in srgb, var(--chip), var(--fg) 6%); }

    .overlay-size-val {
      font-size: 14px;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      min-width: 22px;
      text-align: center;
    }

    .overlay-stats {
      margin-top: auto;
      padding-top: 14px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* Inline format toolbar */
    .fmt-toolbar {
      position: fixed;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(31,31,28,0.12);
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.12s, transform 0.12s;
      z-index: 300;
      font-family: "SF Pro Text", "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      backdrop-filter: blur(16px);
    }

    .fmt-toolbar.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .fmt-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--fg);
      font-size: 13px;
      font-family: inherit;
      padding: 5px 9px;
      border-radius: 5px;
      line-height: 1;
      transition: background 0.1s;
    }

    .fmt-btn:hover { background: var(--chip); }

    .fmt-divider {
      width: 1px;
      height: 18px;
      background: var(--hairline);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* Slash / block menu */
    .slash-menu {
      position: fixed;
      width: 220px;
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 5px;
      max-height: 320px;
      overflow-y: auto;
      scrollbar-width: none;
      display: none;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px) scale(0.97);
      transform-origin: 0 0;
      transition: opacity 0.12s ease, transform 0.12s ease;
      z-index: 300;
      font-family: "SF Pro Text", "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .slash-menu::-webkit-scrollbar { display: none; }

    .slash-menu.visible {
      display: block;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .sm-group-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 8px 3px;
    }

    .sm-group + .sm-group { border-top: 1px solid var(--hairline); margin-top: 4px; padding-top: 4px; }

    .sm-item {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .sm-item:hover,
    .sm-item.active { background: var(--chip); }

    .sm-item.active .sm-name { color: var(--fg); }

    .sm-item.active .sm-badge {
      color: var(--accent);
      background: color-mix(in srgb, var(--accent), transparent 88%);
    }

    .sm-badge {
      width: 26px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--chip);
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      font-family: "SF Mono", "IBM Plex Mono", "Courier New", monospace;
      letter-spacing: 0;
      transition: background 0.1s, color 0.1s;
    }

    .sm-name {
      font-size: 13px;
      font-weight: 500;
      color: color-mix(in srgb, var(--fg), transparent 10%);
    }

    /* Command palette */
    .palette-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20,20,18,0.18);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 400;
    }

    .palette-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .palette {
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 14px;
      box-shadow: var(--shadow);
      width: min(520px, calc(100vw - 32px));
      overflow: hidden;
      transform: translateY(-8px) scale(0.98);
      transition: transform 0.15s;
      font-family: "SF Pro Text", "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      backdrop-filter: blur(18px);
    }

    .palette-backdrop.open .palette {
      transform: translateY(0) scale(1);
    }

    .palette-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--hairline);
    }

    .palette-input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 16px;
      line-height: 1.4;
    }

    .palette-input::placeholder { color: var(--muted); }

    .palette-list {
      max-height: 320px;
      overflow-y: auto;
      padding: 6px;
      scrollbar-width: none;
    }

    .palette-list::-webkit-scrollbar { display: none; }

    .palette-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 50px;
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 13px;
      color: var(--fg);
      cursor: pointer;
    }

    .palette-row.active,
    .palette-row:hover { background: var(--chip); }

    .palette-title { font-weight: 500; }

    .palette-desc {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .palette-keys { display: flex; gap: 4px; }

    .key {
      display: inline-block;
      background: rgba(128,128,128,0.1);
      border: 1px solid var(--hairline);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: inherit;
      line-height: 1.5;
    }

    .palette-footer {
      padding: 10px 16px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--hairline);
      text-align: center;
    }

    /* Link dialog */
    .link-dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20,20,18,0.18);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 500;
    }

    .link-dialog-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .link-dialog {
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 14px;
      box-shadow: var(--shadow);
      width: min(400px, calc(100vw - 32px));
      overflow: hidden;
      font-family: "SF Pro Text", "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      backdrop-filter: blur(18px);
      transform: translateY(-8px) scale(0.98);
      transition: transform 0.15s;
    }

    .link-dialog-backdrop.open .link-dialog {
      transform: translateY(0) scale(1);
    }

    .link-dialog-body { padding: 20px 20px 16px; }

    .link-dialog-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .link-dialog-input {
      width: 100%;
      padding: 9px 12px;
      background: var(--chip);
      border: 1px solid var(--hairline);
      border-radius: 9px;
      font-size: 14px;
      color: var(--fg);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .link-dialog-input:focus { border-color: var(--accent); }

    .link-dialog-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding: 12px 20px;
      border-top: 1px solid var(--hairline);
    }

    .link-dialog-btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      padding: 7px 16px;
      transition: opacity 0.15s, background 0.15s;
    }

    .link-dialog-btn.secondary { background: var(--chip); color: var(--muted); }
    .link-dialog-btn.secondary:hover { color: var(--fg); }
    .link-dialog-btn.primary { background: var(--accent); color: #fff; }
    .link-dialog-btn.primary:hover { opacity: 0.88; }

    @media (max-width: 820px) {
      .page { padding: 48px 18px 64px; }
      .editor-container { max-width: none; }

      #editor { padding-top: 120px; }



      .overlay-card {
        flex-direction: column;
        height: min(640px, calc(100vh - 40px));
      }

      .overlay-notes {
        width: 100%;
        max-height: 220px;
        border-right: none;
        border-bottom: 1px solid var(--hairline);
      }
    }
  </style>
</head>
<body>

  <div class="page" id="page">
    <div class="editor-container">
      <div id="editor" contenteditable="true" spellcheck="true" autocorrect="on" data-placeholder="Start writing…"></div>
    </div>
  </div>

  <button class="corner-trigger" id="cornerTrigger" title="Menu (⌘\)">
    <svg class="corner-logo" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="128" y="128" width="192" height="192" fill="currentColor"/>
      <rect x="320" y="128" width="192" height="192" fill="currentColor"/>
      <rect x="512" y="128" width="192" height="192" fill="currentColor"/>
      <rect x="704" y="128" width="192" height="192" fill="currentColor"/>
      <rect x="704" y="320" width="192" height="192" fill="currentColor"/>
      <rect x="512" y="512" width="192" height="192" fill="currentColor"/>
      <rect x="128" y="512" width="192" height="192" fill="currentColor"/>
      <rect x="704" y="512" width="192" height="192" fill="currentColor"/>
      <rect x="128" y="704" width="192" height="192" fill="currentColor"/>
      <rect x="320" y="704" width="192" height="192" fill="currentColor"/>
    </svg>
  </button>

  <div class="fmt-toolbar" id="fmtToolbar">
    <button class="fmt-btn" data-action="bold" title="Bold (⌘B)"><b>B</b></button>
    <button class="fmt-btn" data-action="italic" title="Italic (⌘I)"><i>I</i></button>
    <button class="fmt-btn" data-action="strike" title="Strikethrough" style="text-decoration:line-through">S</button>
    <div class="fmt-divider"></div>
    <button class="fmt-btn" data-action="code" title="Inline code" style="font-family:monospace;font-size:12px">&lt;/&gt;</button>
    <button class="fmt-btn" data-action="link" title="Link">⌘ Link</button>
  </div>

  <div class="slash-menu" id="slashMenu"></div>

  <div class="palette-backdrop" id="paletteBackdrop">
    <div class="palette" role="dialog" aria-label="Command palette">
      <div class="palette-header">
        <input class="palette-input" id="paletteInput" type="text" placeholder="Command or date..." autocomplete="off">
      </div>
      <div class="palette-list" id="paletteList"></div>
      <div class="palette-footer">Enter to run · Esc to close</div>
    </div>
  </div>

  <div class="overlay-backdrop" id="overlayBackdrop">
    <div class="overlay-card">

      <div class="overlay-notes">
        <div class="overlay-brand">
          <svg class="overlay-brand-logo" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="128" y="128" width="192" height="192" fill="currentColor"/>
            <rect x="320" y="128" width="192" height="192" fill="currentColor"/>
            <rect x="512" y="128" width="192" height="192" fill="currentColor"/>
            <rect x="704" y="128" width="192" height="192" fill="currentColor"/>
            <rect x="704" y="320" width="192" height="192" fill="currentColor"/>
            <rect x="512" y="512" width="192" height="192" fill="currentColor"/>
            <rect x="128" y="512" width="192" height="192" fill="currentColor"/>
            <rect x="704" y="512" width="192" height="192" fill="currentColor"/>
            <rect x="128" y="704" width="192" height="192" fill="currentColor"/>
            <rect x="320" y="704" width="192" height="192" fill="currentColor"/>
          </svg>
          <span class="overlay-brand-name">Tipun</span>
        </div>
        <div class="overlay-streak">
          <div class="overlay-streak-main" id="overlayStreakMain">🔥 0</div>
          <div class="overlay-streak-sub" id="overlayStreakSub">day streak · 0 notes</div>
        </div>
        <div class="overlay-note-list" id="overlayNoteList"></div>
      </div>

      <div class="overlay-settings">
        <div class="overlay-section-label">Writing</div>
        <div class="overlay-toggle-row">
          <span>Focus mode</span>
          <button class="overlay-toggle" id="overlayFocusToggle" data-on="false"></button>
        </div>
        <div class="overlay-toggle-row">
          <span>Dark mode</span>
          <button class="overlay-toggle" id="overlayDarkToggle" data-on="false"></button>
        </div>

        <div class="overlay-divider"></div>

        <div class="overlay-section-label">Font</div>
        <select class="overlay-select" id="overlayFontSelect"></select>
        <div class="overlay-size-row">
          <span>Size</span>
          <div class="overlay-size-ctrl">
            <button class="overlay-size-btn" id="overlayFontSizeDec">−</button>
            <span class="overlay-size-val" id="overlayFontSizeVal">19</span>
            <button class="overlay-size-btn" id="overlayFontSizeInc">+</button>
          </div>
        </div>

        <div class="overlay-stats" id="overlayStats"></div>
      </div>

    </div>
  </div>

  <div class="link-dialog-backdrop" id="linkDialogBackdrop">
    <div class="link-dialog" role="dialog" aria-label="Insert link">
      <div class="link-dialog-body">
        <label class="link-dialog-label" for="linkDialogInput">URL</label>
        <input class="link-dialog-input" id="linkDialogInput" type="url" placeholder="https://…" autocomplete="off" spellcheck="false">
      </div>
      <div class="link-dialog-footer">
        <button class="link-dialog-btn secondary" id="linkDialogCancel">Cancel</button>
        <button class="link-dialog-btn primary" id="linkDialogOk">Insert link</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
