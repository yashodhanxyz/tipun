<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipun</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafaf8;
      --fg: #1a1a1a;
      --muted: #aaa;
      --accent: #4a9eff;
      --editor-font: Georgia, 'Times New Roman', serif;
      --font-size: 19px;
    }

    [data-theme="dark"] {
      --bg: #181818;
      --fg: #d0d0cc;
      --muted: #505050;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      transition: background 0.25s, color 0.25s;
    }

    .page {
      height: 100vh;
      padding: 64px 24px 56px;
      overflow: hidden;
    }

    .editor-container {
      position: relative;
      width: 100%;
      max-width: 720px;
      height: 100%;
      margin: 0 auto;
    }

    #editor,
    #editorHL {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      font-family: var(--editor-font);
      font-size: var(--font-size);
      line-height: 1.85;
      padding-top: calc(50vh - 100px);
      padding-bottom: 120px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
    }

    #editor {
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      overflow-y: auto;
      scrollbar-width: none;
      color: transparent;
      caret-color: var(--accent);
      z-index: 2;
    }

    #editor::-webkit-scrollbar { display: none; }
    #editor::placeholder { color: var(--muted); }

    #editorHL {
      color: var(--fg);
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
      background: transparent;
    }

    #editorHL strong { font-weight: bold; }
    #editorHL em     { font-style: italic; }
    #editorHL s      { text-decoration: line-through; }
    .hl-s            { opacity: 0.3; }
    .hl-heading      { font-weight: bold; }
    .hl-quote        { color: var(--muted); font-style: italic; }
    .hl-code         { font-family: 'Courier New', monospace; font-size: 0.88em; }
    .hl-code-fence   { font-family: 'Courier New', monospace; color: var(--muted); }
    .hl-link         { color: var(--accent); }

    .focus-mode .page {
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,0.3) 18%,
        black 32%,
        black 68%,
        rgba(0,0,0,0.3) 82%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,0.3) 18%,
        black 32%,
        black 68%,
        rgba(0,0,0,0.3) 82%,
        transparent 100%
      );
    }

    .toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 8px 16px;
      background: var(--bg);
      border-top: 1px solid rgba(128,128,128,0.08);
      opacity: 0;
      transition: opacity 0.3s;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      z-index: 100;
      flex-wrap: wrap;
    }

    body:not(.writing) .toolbar,
    .toolbar:hover { opacity: 1; }

    .focus-mode .toolbar       { opacity: 0 !important; pointer-events: none; }
    .focus-mode .toolbar:hover { opacity: 0.7 !important; pointer-events: auto; }

    .stat {
      color: var(--muted);
      white-space: nowrap;
    }

    .sep {
      width: 1px;
      height: 14px;
      background: rgba(128,128,128,0.2);
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-family: inherit;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
      letter-spacing: 0.02em;
    }

    .btn:hover { color: var(--fg); background: rgba(128,128,128,0.1); }
    .btn.active { color: var(--accent); }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .date-input {
      width: 152px;
      min-height: 30px;
      padding: 0 10px;
      background: rgba(128,128,128,0.06);
      border: 1px solid rgba(128,128,128,0.12);
      border-radius: 7px;
      color: var(--fg);
      font-size: 12px;
      font-family: inherit;
      color-scheme: light;
    }

    [data-theme="dark"] .date-input { color-scheme: dark; }
    .date-input:focus { outline: none; border-color: var(--accent); }

    .palette-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 200;
    }

    .palette-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .palette {
      background: var(--bg);
      border: 1px solid rgba(128,128,128,0.15);
      border-radius: 10px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      width: 360px;
      overflow: hidden;
      transform: translateY(-8px) scale(0.98);
      transition: transform 0.15s;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .palette-backdrop.open .palette {
      transform: translateY(0) scale(1);
    }

    .palette-header {
      padding: 14px 18px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid rgba(128,128,128,0.08);
    }

    .palette-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      font-size: 13px;
      color: var(--fg);
    }

    .palette-row + .palette-row {
      border-top: 1px solid rgba(128,128,128,0.06);
    }

    .palette-keys {
      display: flex;
      gap: 4px;
    }

    .key {
      display: inline-block;
      background: rgba(128,128,128,0.1);
      border: 1px solid rgba(128,128,128,0.18);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: inherit;
      line-height: 1.5;
    }

    .palette-footer {
      padding: 10px 18px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid rgba(128,128,128,0.08);
      text-align: center;
    }

    .fmt-toolbar {
      position: fixed;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      background: var(--bg);
      border: 1px solid rgba(128,128,128,0.15);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.12s, transform 0.12s;
      z-index: 300;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .fmt-toolbar.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .fmt-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--fg);
      font-size: 13px;
      font-family: inherit;
      padding: 5px 9px;
      border-radius: 5px;
      line-height: 1;
      transition: background 0.1s;
    }

    .fmt-btn:hover { background: rgba(128,128,128,0.12); }

    .fmt-divider {
      width: 1px;
      height: 18px;
      background: rgba(128,128,128,0.2);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .slash-menu {
      position: fixed;
      background: var(--bg);
      border: 1px solid rgba(128,128,128,0.15);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      width: 240px;
      max-height: 300px;
      overflow-y: auto;
      scrollbar-width: none;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.12s, transform 0.12s;
      z-index: 300;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 4px;
    }

    .slash-menu::-webkit-scrollbar { display: none; }

    .slash-menu.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .slash-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .slash-item:hover,
    .slash-item.active { background: rgba(128,128,128,0.09); }

    .slash-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(128,128,128,0.08);
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--fg);
      flex-shrink: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .slash-label {
      font-size: 13px;
      color: var(--fg);
      font-weight: 500;
    }

    .slash-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.2);
      z-index: 399;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .settings-overlay.open { opacity: 1; pointer-events: auto; }

    .settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 280px;
      background: var(--bg);
      border-left: 1px solid rgba(128,128,128,0.12);
      box-shadow: -8px 0 32px rgba(0,0,0,0.08);
      z-index: 400;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 0 0 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .settings-panel::-webkit-scrollbar { display: none; }
    .settings-panel.open { transform: translateX(0); }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(128,128,128,0.08);
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .settings-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }

    .settings-close:hover { color: var(--fg); background: rgba(128,128,128,0.1); }

    .settings-group {
      padding: 20px 20px 0;
    }

    .settings-group + .settings-group {
      padding-top: 24px;
      border-top: 1px solid rgba(128,128,128,0.06);
      margin-top: 20px;
    }

    .settings-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .settings-label span {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      color: var(--fg);
    }

    .settings-select {
      width: 100%;
      padding: 9px 12px;
      background: rgba(128,128,128,0.06);
      border: 1px solid rgba(128,128,128,0.12);
      border-radius: 6px;
      font-size: 13px;
      color: var(--fg);
      font-family: inherit;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .settings-select:focus { outline: none; border-color: var(--accent); }

    .size-row { display: flex; align-items: center; gap: 10px; }

    .size-btn {
      background: rgba(128,128,128,0.08);
      border: 1px solid rgba(128,128,128,0.12);
      border-radius: 5px;
      cursor: pointer;
      color: var(--fg);
      font-size: 16px;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .size-btn:hover { background: rgba(128,128,128,0.15); }

    .size-val {
      flex: 1;
      text-align: center;
      font-size: 14px;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 820px) {
      .page {
        padding: 48px 16px 76px;
      }

      .editor-container {
        max-width: none;
      }

      #editor,
      #editorHL {
        padding-top: 120px;
      }

      .toolbar {
        gap: 10px;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="page" id="page">
    <div class="editor-container">
      <div id="editorHL" aria-hidden="true"></div>
      <textarea id="editor" placeholder="Start writing…" spellcheck="true" autocorrect="on"></textarea>
    </div>
  </div>

  <div class="toolbar">
    <span class="stat" id="wordCount">0 words</span>
    <span class="stat" id="charCount">0 chars</span>
    <span class="stat" id="activeDateLabel">Today</span>
    <div class="sep"></div>
    <div class="date-nav">
      <button class="btn" id="prevDateBtn" title="Previous day">←</button>
      <input class="date-input" id="dateInput" type="date" aria-label="Note date">
      <button class="btn" id="todayBtn">Today</button>
      <button class="btn" id="nextDateBtn" title="Next day">→</button>
    </div>
    <div class="sep"></div>
    <button class="btn" id="focusBtn">Focus</button>
    <button class="btn" id="themeBtn">Dark</button>
    <button class="btn" id="fullscreenBtn">Fullscreen</button>
    <div class="sep"></div>
    <button class="btn" id="settingsBtn" title="Settings (⌘,)">⚙</button>
  </div>

  <div class="settings-overlay" id="settingsOverlay"></div>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-head">
      Settings
      <button class="settings-close" id="settingsClose">✕</button>
    </div>

    <div class="settings-group">
      <div class="settings-label">Font</div>
      <select class="settings-select" id="fontSelect"></select>
    </div>

    <div class="settings-group">
      <div class="settings-label">
        Font size
        <span id="fontSizeVal">19px</span>
      </div>
      <div class="size-row">
        <button class="size-btn" id="fontSizeDec">−</button>
        <span class="size-val" id="fontSizeDisplay">19</span>
        <button class="size-btn" id="fontSizeInc">+</button>
      </div>
    </div>
  </div>

  <div class="fmt-toolbar" id="fmtToolbar">
    <button class="fmt-btn" data-action="bold" title="Bold (⌘B)"><b>B</b></button>
    <button class="fmt-btn" data-action="italic" title="Italic (⌘I)"><i>I</i></button>
    <button class="fmt-btn" data-action="strike" title="Strikethrough" style="text-decoration:line-through">S</button>
    <div class="fmt-divider"></div>
    <button class="fmt-btn" data-action="code" title="Inline code" style="font-family:monospace;font-size:12px">&lt;/&gt;</button>
    <button class="fmt-btn" data-action="link" title="Link">⌘ Link</button>
  </div>

  <div class="slash-menu" id="slashMenu"></div>

  <div class="palette-backdrop" id="paletteBackdrop">
    <div class="palette" role="dialog" aria-label="Keyboard shortcuts">
      <div class="palette-header">Keyboard shortcuts</div>
      <div class="palette-row">
        <span>Bold</span>
        <span class="palette-keys"><kbd class="key">⌘</kbd><kbd class="key">B</kbd></span>
      </div>
      <div class="palette-row">
        <span>Italic</span>
        <span class="palette-keys"><kbd class="key">⌘</kbd><kbd class="key">I</kbd></span>
      </div>
      <div class="palette-row">
        <span>Previous day</span>
        <span class="palette-keys"><kbd class="key">Alt</kbd><kbd class="key">←</kbd></span>
      </div>
      <div class="palette-row">
        <span>Next day</span>
        <span class="palette-keys"><kbd class="key">Alt</kbd><kbd class="key">→</kbd></span>
      </div>
      <div class="palette-row">
        <span>Slash commands</span>
        <span class="palette-keys"><kbd class="key">/</kbd><span style="font-size:11px;color:var(--muted);margin-left:4px">at line start</span></span>
      </div>
      <div class="palette-row">
        <span>Focus mode</span>
        <span class="palette-keys"><kbd class="key">⌘</kbd><kbd class="key">⇧</kbd><kbd class="key">F</kbd></span>
      </div>
      <div class="palette-row">
        <span>Toggle dark mode</span>
        <span class="palette-keys"><kbd class="key">⌘</kbd><kbd class="key">⇧</kbd><kbd class="key">D</kbd></span>
      </div>
      <div class="palette-row">
        <span>Fullscreen</span>
        <span class="palette-keys"><kbd class="key">⌘</kbd><kbd class="key">⇧</kbd><kbd class="key">G</kbd></span>
      </div>
      <div class="palette-row">
        <span>Open settings</span>
        <span class="palette-keys"><kbd class="key">⌘</kbd><kbd class="key">,</kbd></span>
      </div>
      <div class="palette-row">
        <span>Show shortcuts</span>
        <span class="palette-keys"><kbd class="key">⌘</kbd><kbd class="key">K</kbd></span>
      </div>
      <div class="palette-footer">Press <kbd class="key">Esc</kbd> to close</div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    const STORAGE_KEYS = {
      notes: 'writer-notes-by-date',
      activeDate: 'writer-active-date',
      theme: 'writer-theme',
      font: 'writer-font',
      fontSize: 'writer-font-size',
      legacyContent: 'writer-content',
      legacyOpenDates: 'writer-open-dates',
    };

    const editor          = $('editor');
    const editorHL        = $('editorHL');
    const wordCountEl     = $('wordCount');
    const charCountEl     = $('charCount');
    const activeDateLabel = $('activeDateLabel');
    const dateInput       = $('dateInput');
    const prevDateBtn     = $('prevDateBtn');
    const todayBtn        = $('todayBtn');
    const nextDateBtn     = $('nextDateBtn');
    const focusBtn        = $('focusBtn');
    const themeBtn        = $('themeBtn');
    const fullscreenBtn   = $('fullscreenBtn');
    const settingsBtn     = $('settingsBtn');
    const settingsPanel   = $('settingsPanel');
    const settingsOverlay = $('settingsOverlay');
    const settingsClose   = $('settingsClose');
    const fontSelect      = $('fontSelect');
    const fontSizeVal     = $('fontSizeVal');
    const fontSizeDisplay = $('fontSizeDisplay');
    const fontSizeInc     = $('fontSizeInc');
    const fontSizeDec     = $('fontSizeDec');
    const paletteBackdrop = $('paletteBackdrop');
    const fmtToolbar      = $('fmtToolbar');
    const slashMenu       = $('slashMenu');

    const dateLabelFormatter = new Intl.DateTimeFormat(undefined, {
      weekday: 'short',
      month: 'short',
      day: 'numeric',
      year: 'numeric',
    });

    const FONTS = [
      { label: 'Georgia',            value: 'Georgia',            google: false, cat: 'Serif' },

      { label: 'EB Garamond',        value: 'EB Garamond',        google: true,  cat: 'Serif' },
      { label: 'Crimson Text',       value: 'Crimson Text',       google: true,  cat: 'Serif' },
      { label: 'Cormorant Garamond', value: 'Cormorant Garamond', google: true,  cat: 'Serif' },
      { label: 'Libre Baskerville',  value: 'Libre Baskerville',  google: true,  cat: 'Serif' },
      { label: 'Spectral',           value: 'Spectral',           google: true,  cat: 'Serif' },
      { label: 'Bitter',             value: 'Bitter',             google: true,  cat: 'Serif' },
      { label: 'Alegreya',           value: 'Alegreya',           google: true,  cat: 'Serif' },
      { label: 'Vollkorn',           value: 'Vollkorn',           google: true,  cat: 'Serif' },
      { label: 'Zilla Slab',         value: 'Zilla Slab',         google: true,  cat: 'Serif' },
      { label: 'Inter',              value: 'Inter',              google: true,  cat: 'Sans-serif' },
      { label: 'Source Sans 3',      value: 'Source Sans 3',      google: true,  cat: 'Sans-serif' },
      { label: 'Nunito',             value: 'Nunito',             google: true,  cat: 'Sans-serif' },
      { label: 'Lato',               value: 'Lato',               google: true,  cat: 'Sans-serif' },
      { label: 'Open Sans',          value: 'Open Sans',          google: true,  cat: 'Sans-serif' },
      { label: 'Jost',               value: 'Jost',               google: true,  cat: 'Sans-serif' },
      { label: 'DM Sans',            value: 'DM Sans',            google: true,  cat: 'Sans-serif' },
      { label: 'Outfit',             value: 'Outfit',             google: true,  cat: 'Sans-serif' },
      { label: 'Plus Jakarta Sans',  value: 'Plus Jakarta Sans',  google: true,  cat: 'Sans-serif' },
      { label: 'Figtree',            value: 'Figtree',            google: true,  cat: 'Sans-serif' },
      { label: 'Mulish',             value: 'Mulish',             google: true,  cat: 'Sans-serif' },
      { label: 'Karla',              value: 'Karla',              google: true,  cat: 'Sans-serif' },
      { label: 'IBM Plex Mono',      value: 'IBM Plex Mono',      google: true,  cat: 'Monospace' },
      { label: 'Inconsolata',        value: 'Inconsolata',        google: true,  cat: 'Monospace' },
      { label: 'Fira Code',          value: 'Fira Code',          google: true,  cat: 'Monospace' },
      { label: 'Source Code Pro',    value: 'Source Code Pro',    google: true,  cat: 'Monospace' },
      { label: 'JetBrains Mono',     value: 'JetBrains Mono',     google: true,  cat: 'Monospace' },
      { label: 'Space Mono',         value: 'Space Mono',         google: true,  cat: 'Monospace' },
      { label: 'DM Serif Display',   value: 'DM Serif Display',   google: true,  cat: 'Display' },
      { label: 'Fraunces',           value: 'Fraunces',           google: true,  cat: 'Display' },
      { label: 'Libre Caslon Text',  value: 'Libre Caslon Text',  google: true,  cat: 'Display' },
      { label: 'Yeseva One',         value: 'Yeseva One',         google: true,  cat: 'Display' },
    ];

    const SLASH_CMDS = [
      { label: 'Heading 1',     desc: 'Large heading',     icon: 'H1',   prefix: '# ',      aliases: ['h1', 'heading 1'] },
      { label: 'Heading 2',     desc: 'Medium heading',    icon: 'H2',   prefix: '## ',     aliases: ['h2', 'heading 2'] },
      { label: 'Heading 3',     desc: 'Small heading',     icon: 'H3',   prefix: '### ',    aliases: ['h3', 'heading 3'] },
      { label: 'Bullet List',   desc: 'Unordered list',    icon: '•',    prefix: '- ',      aliases: ['bullet'] },
      { label: 'Numbered List', desc: 'Ordered list',      icon: '1.',   prefix: '1. ',     aliases: ['numbered'] },
      { label: 'Quote',         desc: 'Blockquote',        icon: '"',    prefix: '> ',      aliases: ['quote'] },
      { label: 'Code Block',    desc: 'Fenced code block', icon: '</>',  prefix: '```\n',   suffix: '\n```', aliases: ['code'] },
      { label: 'Divider',       desc: 'Horizontal rule',   icon: '—',    prefix: '\n---\n', aliases: ['divider'] },
    ];

    let notesByDate = {};
    let activeDate = '';
    let noteViewState = {};
    let isFocus = false;
    let isDark = false;
    let currentFontSize = 19;
    let writeTimer;
    let hlTimer;
    let slashState = { start: -1, active: 0, filtered: [] };

    init();

    function init() {
      loadNotesState();
      populateFontOptions();
      bindEvents();

      if (localStorage.getItem(STORAGE_KEYS.theme) === 'dark') applyTheme(true);

      const savedFont = localStorage.getItem(STORAGE_KEYS.font);
      const savedSize = localStorage.getItem(STORAGE_KEYS.fontSize);
      if (savedFont) applyFont(savedFont);
      if (savedSize) applyFontSize(+savedSize);

      loadActiveNote({ focus: true, moveCaretToEnd: true });
    }

    function bindEvents() {
      editor.addEventListener('input', handleEditorInput);
      editor.addEventListener('scroll', handleEditorScroll);
      editor.addEventListener('keydown', handleEditorKeydown);
      editor.addEventListener('mouseup', e => {
        setTimeout(() => showFmtToolbar(e.clientX, e.clientY), 10);
      });
      editor.addEventListener('keyup', () => {
        if (editor.selectionStart !== editor.selectionEnd) {
          const pos = getCaretPos(editor);
          showFmtToolbar(pos.left, pos.top);
        } else {
          hideFmtToolbar();
        }
      });

      prevDateBtn.addEventListener('click', () => switchToDate(shiftDateKey(activeDate, -1)));
      todayBtn.addEventListener('click', () => switchToDate(todayKey()));
      nextDateBtn.addEventListener('click', () => switchToDate(shiftDateKey(activeDate, 1)));
      dateInput.addEventListener('change', () => {
        const normalized = normalizeDateInput(dateInput.value);
        if (!normalized) return;
        switchToDate(normalized);
      });

      focusBtn.addEventListener('click', toggleFocus);
      themeBtn.addEventListener('click', () => applyTheme(!isDark));
      fullscreenBtn.addEventListener('click', toggleFullscreen);

      fmtToolbar.addEventListener('mousedown', e => e.preventDefault());
      fmtToolbar.addEventListener('click', handleFmtToolbarClick);
      slashMenu.addEventListener('click', handleSlashMenuClick);

      document.addEventListener('mousedown', e => {
        if (!fmtToolbar.contains(e.target)) hideFmtToolbar();
        if (!slashMenu.contains(e.target)) hideSlashMenu();
      });

      document.addEventListener('keydown', handleGlobalShortcuts);
      document.addEventListener('fullscreenchange', () => {
        const isFs = !!document.fullscreenElement;
        fullscreenBtn.textContent = isFs ? 'Exit Fullscreen' : 'Fullscreen';
        fullscreenBtn.classList.toggle('active', isFs);
      });

      paletteBackdrop.addEventListener('click', e => {
        if (e.target === paletteBackdrop) closePalette();
      });

      settingsBtn.addEventListener('click', openSettings);
      settingsClose.addEventListener('click', closeSettings);
      settingsOverlay.addEventListener('click', closeSettings);

      fontSelect.addEventListener('change', () => applyFont(fontSelect.value));
      fontSizeInc.addEventListener('click', () => applyFontSize(currentFontSize + 1));
      fontSizeDec.addEventListener('click', () => applyFontSize(currentFontSize - 1));
    }

    function safeParse(raw, fallback) {
      try {
        const parsed = JSON.parse(raw);
        return parsed ?? fallback;
      } catch {
        return fallback;
      }
    }

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function formatDateKey(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function todayKey() {
      return formatDateKey(new Date());
    }

    function parseDateKey(dateKey) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return null;
      const [year, month, day] = dateKey.split('-').map(Number);
      const date = new Date(year, month - 1, day);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
      return date;
    }

    function normalizeDateInput(value) {
      const raw = String(value || '').trim();
      if (!raw) return null;

      const alias = raw.toLowerCase();
      if (alias === 'today') return todayKey();
      if (alias === 'yesterday') return shiftDateKey(todayKey(), -1);
      if (alias === 'tomorrow') return shiftDateKey(todayKey(), 1);

      const parsed = parseDateKey(raw);
      return parsed ? formatDateKey(parsed) : null;
    }

    function shiftDateKey(dateKey, delta) {
      const date = parseDateKey(dateKey);
      if (!date) return todayKey();
      date.setDate(date.getDate() + delta);
      return formatDateKey(date);
    }

    function displayDateLabel(dateKey) {
      const date = parseDateKey(dateKey);
      if (!date) return dateKey;
      const label = dateLabelFormatter.format(date);
      return dateKey === todayKey() ? `Today · ${label}` : label;
    }

    function ensureNote(dateKey) {
      if (typeof notesByDate[dateKey] !== 'string') notesByDate[dateKey] = '';
    }

    function persistNotes() {
      localStorage.setItem(STORAGE_KEYS.notes, JSON.stringify(notesByDate));
    }

    function persistActiveDate() {
      localStorage.setItem(STORAGE_KEYS.activeDate, activeDate);
    }

    function loadNotesState() {
      const rawNotes = safeParse(localStorage.getItem(STORAGE_KEYS.notes), {});
      notesByDate = rawNotes && typeof rawNotes === 'object' && !Array.isArray(rawNotes) ? rawNotes : {};

      const legacyContent = localStorage.getItem(STORAGE_KEYS.legacyContent);
      if (!Object.keys(notesByDate).length && legacyContent) {
        notesByDate[todayKey()] = legacyContent;
        localStorage.removeItem(STORAGE_KEYS.legacyContent);
      }

      const savedActiveDate = normalizeDateInput(localStorage.getItem(STORAGE_KEYS.activeDate));
      const legacyOpenDates = safeParse(localStorage.getItem(STORAGE_KEYS.legacyOpenDates), []);
      const legacyOpenDate = Array.isArray(legacyOpenDates) ? normalizeDateInput(legacyOpenDates[0]) : null;
      const existingLatestDate = Object.keys(notesByDate).sort().slice(-1)[0];

      activeDate = savedActiveDate || legacyOpenDate || existingLatestDate || todayKey();
      ensureNote(activeDate);
      persistNotes();
      persistActiveDate();
    }

    function saveCurrentViewState() {
      noteViewState[activeDate] = {
        scrollTop: editor.scrollTop,
        selectionStart: editor.selectionStart,
        selectionEnd: editor.selectionEnd,
      };
    }

    function loadActiveNote(options = {}) {
      ensureNote(activeDate);
      editor.value = notesByDate[activeDate];
      dateInput.value = activeDate;
      activeDateLabel.textContent = displayDateLabel(activeDate);
      todayBtn.classList.toggle('active', activeDate === todayKey());
      updateStats();
      syncHL();

      const savedState = noteViewState[activeDate];
      const moveCaretToEnd = options.moveCaretToEnd || !savedState;
      if (savedState && !moveCaretToEnd) {
        editor.scrollTop = savedState.scrollTop || 0;
        editor.selectionStart = savedState.selectionStart ?? editor.value.length;
        editor.selectionEnd = savedState.selectionEnd ?? editor.value.length;
      } else {
        editor.scrollTop = 0;
        editor.selectionStart = editor.selectionEnd = editor.value.length;
      }
      editorHL.scrollTop = editor.scrollTop;

      hideFmtToolbar();
      hideSlashMenu();
      if (options.focus) editor.focus();
    }

    function switchToDate(dateKey, options = {}) {
      const normalized = normalizeDateInput(dateKey);
      if (!normalized || normalized === activeDate) return;

      saveCurrentViewState();
      activeDate = normalized;
      ensureNote(activeDate);
      persistNotes();
      persistActiveDate();
      loadActiveNote({ focus: options.focus !== false, moveCaretToEnd: !!options.moveCaretToEnd });
    }

    function populateFontOptions() {
      const fontGroups = {};
      FONTS.forEach(font => { (fontGroups[font.cat] = fontGroups[font.cat] || []).push(font); });

      Object.entries(fontGroups).forEach(([category, fonts]) => {
        const group = document.createElement('optgroup');
        group.label = category;
        fonts.forEach(font => {
          const option = document.createElement('option');
          option.value = font.value;
          option.textContent = font.label;
          group.appendChild(option);
        });
        fontSelect.appendChild(group);
      });
    }

    function updateStats() {
      const text = notesByDate[activeDate] || '';
      const trimmed = text.trim();
      const words = trimmed ? trimmed.split(/\s+/).filter(Boolean).length : 0;
      wordCountEl.textContent = words === 1 ? '1 word' : `${words.toLocaleString()} words`;
      charCountEl.textContent = `${text.length.toLocaleString()} chars`;
    }

    function handleEditorInput() {
      notesByDate[activeDate] = editor.value;
      persistNotes();
      updateStats();

      document.body.classList.add('writing');
      clearTimeout(writeTimer);
      writeTimer = setTimeout(() => document.body.classList.remove('writing'), 1500);

      if (isFocus) scrollToCursor();
      checkSlashCommand();
      scheduleHL();
    }

    function handleEditorScroll() {
      editorHL.scrollTop = editor.scrollTop;
      saveCurrentViewState();
    }

    function emitSyntheticInput() {
      editor.dispatchEvent(new Event('input'));
    }

    function handleEditorKeydown(e) {
      if (slashMenu.classList.contains('visible')) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          slashState.active = (slashState.active + 1) % slashState.filtered.length;
          slashMenu.querySelectorAll('.slash-item').forEach((item, index) => item.classList.toggle('active', index === slashState.active));
          return;
        }

        if (e.key === 'ArrowUp') {
          e.preventDefault();
          slashState.active = (slashState.active - 1 + slashState.filtered.length) % slashState.filtered.length;
          slashMenu.querySelectorAll('.slash-item').forEach((item, index) => item.classList.toggle('active', index === slashState.active));
          return;
        }

        if (e.key === 'Enter' || e.key === 'Tab') {
          e.preventDefault();
          applySlashCommand(slashState.filtered[slashState.active]);
          return;
        }

        if (e.key === 'Escape') {
          hideSlashMenu();
          return;
        }
      }

      if (e.key === 'ArrowLeft' && e.altKey) {
        e.preventDefault();
        switchToDate(shiftDateKey(activeDate, -1));
        return;
      }

      if (e.key === 'ArrowRight' && e.altKey) {
        e.preventDefault();
        switchToDate(shiftDateKey(activeDate, 1));
        return;
      }

      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        editor.value = editor.value.slice(0, start) + '  ' + editor.value.slice(editor.selectionEnd);
        editor.selectionStart = editor.selectionEnd = start + 2;
        emitSyntheticInput();
      }
    }

    function toggleFocus() {
      isFocus = !isFocus;
      document.body.classList.toggle('focus-mode', isFocus);
      focusBtn.classList.toggle('active', isFocus);
      focusBtn.textContent = isFocus ? 'Unfocus' : 'Focus';
      if (isFocus) {
        scrollToCursor();
        editor.focus();
      }
    }

    function scrollToCursor() {
      const lineHeight = parseFloat(getComputedStyle(editor).lineHeight);
      const paddingTop = parseFloat(getComputedStyle(editor).paddingTop) || 0;
      const lineCount = editor.value.substring(0, editor.selectionStart).split('\n').length;
      editor.scrollTop = Math.max(0, paddingTop + (lineCount - 1) * lineHeight - editor.clientHeight / 2 + lineHeight / 2);
      editorHL.scrollTop = editor.scrollTop;
      saveCurrentViewState();
    }

    function applyTheme(dark) {
      isDark = dark;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      themeBtn.textContent = dark ? 'Light' : 'Dark';
      themeBtn.classList.toggle('active', dark);
      localStorage.setItem(STORAGE_KEYS.theme, dark ? 'dark' : 'light');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function scheduleHL() {
      cancelAnimationFrame(hlTimer);
      hlTimer = requestAnimationFrame(syncHL);
    }

    function esc(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function applyInlineHL(text) {
      let transformed = esc(text);

      const codes = [];
      transformed = transformed.replace(/`([^`\n]+)`/g, match => {
        codes.push(esc(match.slice(1, -1)));
        return `\uFFFE${codes.length - 1}\uFFFE`;
      });

      transformed = transformed
        .replace(/\*\*\*(.+?)\*\*\*/g, '<span class="hl-s">***</span><strong><em>$1</em></strong><span class="hl-s">***</span>')
        .replace(/\*\*(.+?)\*\*/g, '<span class="hl-s">**</span><strong>$1</strong><span class="hl-s">**</span>')
        .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<span class="hl-s">*</span><em>$1</em><span class="hl-s">*</span>')
        .replace(/~~(.+?)~~/g, '<span class="hl-s">~~</span><s>$1</s><span class="hl-s">~~</span>')
        .replace(/\[([^\]\n]+)\]\(([^)\n]+)\)/g, '<span class="hl-link">[$1]($2)</span>');

      return transformed.replace(/\uFFFE(\d+)\uFFFE/g, (_, index) =>
        `<span class="hl-s">\`</span><span class="hl-code">${codes[+index]}</span><span class="hl-s">\`</span>`
      );
    }

    function syncHL() {
      const html = editor.value.split('\n').map(line => {
        const headingMatch = line.match(/^(#{1,6})([ \t].*|$)/);
        if (headingMatch) {
          return `<span class="hl-s">${esc(headingMatch[1])}</span><span class="hl-heading">${applyInlineHL(headingMatch[2])}</span>`;
        }

        if (/^---+\s*$/.test(line)) return `<span class="hl-s">${esc(line)}</span>`;

        const quoteMatch = line.match(/^(> )(.*)$/);
        if (quoteMatch) {
          return `<span class="hl-s">&gt; </span><span class="hl-quote">${applyInlineHL(quoteMatch[2])}</span>`;
        }

        const bulletMatch = line.match(/^([-*+] )(.*)$/);
        if (bulletMatch) {
          return `<span class="hl-s">${esc(bulletMatch[1])}</span>${applyInlineHL(bulletMatch[2])}`;
        }

        const numberedMatch = line.match(/^(\d+\. )(.*)$/);
        if (numberedMatch) {
          return `<span class="hl-s">${esc(numberedMatch[1])}</span>${applyInlineHL(numberedMatch[2])}`;
        }

        if (/^```/.test(line)) return `<span class="hl-code-fence">${esc(line)}</span>`;
        return applyInlineHL(line);
      }).join('\n');

      editorHL.innerHTML = html;
      editorHL.scrollTop = editor.scrollTop;
    }

    function getCaretPos(textarea) {
      const mirror = document.createElement('div');
      const style = window.getComputedStyle(textarea);

      [
        'fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing',
        'lineHeight', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
        'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',
        'boxSizing'
      ].forEach(prop => { mirror.style[prop] = style[prop]; });

      const rect = textarea.getBoundingClientRect();
      mirror.style.position = 'fixed';
      mirror.style.top = rect.top + 'px';
      mirror.style.left = rect.left + 'px';
      mirror.style.width = rect.width + 'px';
      mirror.style.height = rect.height + 'px';
      mirror.style.overflow = 'hidden';
      mirror.style.visibility = 'hidden';
      mirror.style.zIndex = '-1';
      mirror.style.whiteSpace = 'pre-wrap';
      mirror.style.wordBreak = 'break-word';

      document.body.appendChild(mirror);
      mirror.scrollTop = textarea.scrollTop;
      mirror.appendChild(document.createTextNode(textarea.value.substring(0, textarea.selectionEnd)));
      const marker = document.createElement('span');
      marker.textContent = '\u200b';
      mirror.appendChild(marker);
      const markerRect = marker.getBoundingClientRect();
      document.body.removeChild(mirror);
      return { top: markerRect.top, left: markerRect.left, bottom: markerRect.bottom };
    }

    function wrapSelection(prefix, suffix) {
      const closing = suffix ?? prefix;
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const selection = editor.value.slice(start, end);

      if (
        editor.value.slice(start - prefix.length, start) === prefix &&
        editor.value.slice(end, end + closing.length) === closing
      ) {
        editor.value = editor.value.slice(0, start - prefix.length) + selection + editor.value.slice(end + closing.length);
        editor.selectionStart = start - prefix.length;
        editor.selectionEnd = end - prefix.length;
      } else {
        editor.value = editor.value.slice(0, start) + prefix + selection + closing + editor.value.slice(end);
        editor.selectionStart = start + prefix.length;
        editor.selectionEnd = end + prefix.length;
      }

      emitSyntheticInput();
      editor.focus();
    }

    function insertLink() {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const selection = editor.value.slice(start, end) || 'link text';
      const url = prompt('URL:');
      if (!url) {
        editor.focus();
        return;
      }

      const replacement = `[${selection}](${url})`;
      editor.value = editor.value.slice(0, start) + replacement + editor.value.slice(end);
      editor.selectionStart = start;
      editor.selectionEnd = start + replacement.length;
      emitSyntheticInput();
      editor.focus();
      hideFmtToolbar();
    }

    function handleFmtToolbarClick(event) {
      const btn = event.target.closest('[data-action]');
      if (!btn) return;

      const action = btn.dataset.action;
      if (action === 'bold')   wrapSelection('**');
      if (action === 'italic') wrapSelection('*');
      if (action === 'strike') wrapSelection('~~');
      if (action === 'code')   wrapSelection('`');
      if (action === 'link')   { insertLink(); return; }
      hideFmtToolbar();
    }

    function showFmtToolbar(x, y) {
      if (editor.selectionStart === editor.selectionEnd) {
        hideFmtToolbar();
        return;
      }

      const toolbarWidth = fmtToolbar.offsetWidth || 210;
      const left = Math.min(Math.max(x - toolbarWidth / 2, 8), window.innerWidth - toolbarWidth - 8);
      const top = Math.max(y - 56, 8);
      fmtToolbar.style.left = left + 'px';
      fmtToolbar.style.top = top + 'px';
      fmtToolbar.classList.add('visible');
    }

    function hideFmtToolbar() {
      fmtToolbar.classList.remove('visible');
    }

    function checkSlashCommand() {
      const pos = editor.selectionStart;
      const value = editor.value;

      if (slashState.start !== -1) {
        if (pos <= slashState.start || value[slashState.start] !== '/') {
          hideSlashMenu();
          return;
        }

        const query = value.slice(slashState.start + 1, pos);
        if (query.includes('\n')) {
          hideSlashMenu();
          return;
        }

        renderSlashMenu(query.toLowerCase());
        return;
      }

      if (value[pos - 1] !== '/') return;
      const lineStart = value.lastIndexOf('\n', pos - 2) + 1;
      const textBefore = value.slice(lineStart, pos - 1);
      if (textBefore.trim() !== '') return;

      slashState.start = pos - 1;
      slashState.active = 0;
      renderSlashMenu('');
    }

    function renderSlashMenu(query) {
      slashState.filtered = SLASH_CMDS.filter(cmd => {
        const terms = [cmd.label, cmd.desc, ...(cmd.aliases || [])].join(' ').toLowerCase();
        return !query || terms.includes(query);
      });

      if (!slashState.filtered.length) {
        hideSlashMenu();
        return;
      }

      slashState.active = Math.max(0, Math.min(slashState.active, slashState.filtered.length - 1));

      slashMenu.innerHTML = slashState.filtered.map((cmd, index) => `
        <div class="slash-item${index === slashState.active ? ' active' : ''}" data-index="${index}">
          <div class="slash-icon">${cmd.icon}</div>
          <div>
            <div class="slash-label">${cmd.label}</div>
            <div class="slash-desc">${cmd.desc}</div>
          </div>
        </div>
      `).join('');

      const pos = getCaretPos(editor);
      const menuHeight = Math.min(slashState.filtered.length * 48 + 8, 300);
      let top = pos.bottom + 6;
      if (top + menuHeight > window.innerHeight - 8) top = pos.top - menuHeight - 6;
      const left = Math.min(Math.max(pos.left, 8), window.innerWidth - 248);

      slashMenu.style.top = top + 'px';
      slashMenu.style.left = left + 'px';
      slashMenu.classList.add('visible');
    }

    function applySlashCommand(command) {
      const pos = editor.selectionStart;
      const before = editor.value.slice(0, slashState.start);
      const after = editor.value.slice(pos);

      if (command.suffix) {
        editor.value = before + command.prefix + command.suffix + after;
        editor.selectionStart = editor.selectionEnd = slashState.start + command.prefix.length;
      } else {
        editor.value = before + command.prefix + after;
        editor.selectionStart = editor.selectionEnd = slashState.start + command.prefix.length;
      }

      emitSyntheticInput();
      editor.focus();
      hideSlashMenu();
    }

    function handleSlashMenuClick(event) {
      const item = event.target.closest('.slash-item');
      if (!item) return;
      applySlashCommand(slashState.filtered[+item.dataset.index]);
    }

    function hideSlashMenu() {
      slashMenu.classList.remove('visible');
      slashState = { start: -1, active: 0, filtered: [] };
    }

    function openPalette() {
      paletteBackdrop.classList.add('open');
    }

    function closePalette() {
      paletteBackdrop.classList.remove('open');
    }

    function handleGlobalShortcuts(event) {
      const mod = event.ctrlKey || event.metaKey;

      if (event.key === 'Escape') {
        closePalette();
        closeSettings();
        hideSlashMenu();
        hideFmtToolbar();
        return;
      }

      if (mod && !event.shiftKey && event.key === 'k') {
        event.preventDefault();
        paletteBackdrop.classList.contains('open') ? closePalette() : openPalette();
        return;
      }

      if (mod && !event.shiftKey && event.key === 'b') {
        event.preventDefault();
        wrapSelection('**');
        return;
      }

      if (mod && !event.shiftKey && event.key === 'i') {
        event.preventDefault();
        wrapSelection('*');
        return;
      }

      if (mod && !event.shiftKey && event.key === ',') {
        event.preventDefault();
        openSettings();
        return;
      }

      if (!mod || !event.shiftKey) return;

      const shortcutMap = {
        F: toggleFocus,
        D: () => applyTheme(!isDark),
        G: toggleFullscreen,
      };

      const fn = shortcutMap[event.key.toUpperCase()];
      if (fn) {
        event.preventDefault();
        fn();
      }
    }

    function loadGoogleFont(name) {
      const id = 'gf-' + name.replace(/\s+/g, '-');
      if (document.getElementById(id)) return;

      const link = document.createElement('link');
      link.id = id;
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(name)}:ital,wght@0,400;0,700;1,400&display=swap`;
      document.head.appendChild(link);
    }

    function applyFont(name) {
      const font = FONTS.find(item => item.value === name);
      if (!font) return;

      if (font.google) loadGoogleFont(name);

      const stack = font.google ? `'${name}', Georgia, serif` : `Georgia, 'Times New Roman', serif`;
      document.documentElement.style.setProperty('--editor-font', stack);
      fontSelect.value = name;
      localStorage.setItem(STORAGE_KEYS.font, name);
      syncHL();
    }

    function applyFontSize(size) {
      currentFontSize = Math.min(28, Math.max(14, size));
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      fontSizeVal.textContent = currentFontSize + 'px';
      fontSizeDisplay.textContent = currentFontSize;
      localStorage.setItem(STORAGE_KEYS.fontSize, currentFontSize);
      syncHL();
    }

    function openSettings() {
      settingsPanel.classList.add('open');
      settingsOverlay.classList.add('open');
    }

    function closeSettings() {
      settingsPanel.classList.remove('open');
      settingsOverlay.classList.remove('open');
    }
  </script>
</body>
</html>
